# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Every push to main/master: test, build, publish the dev-build and the wiki page.
  push:
    branches:
      - 'main'
      - 'master'

  # Every pull request: test and build only. The release upload and the wiki publish are
  # guarded below, so a contributor's PR can never overwrite the dev-build or the wiki.
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: android_app

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu" # See 'Supported distributions' for available options
          java-version: "21"
          cache: "gradle"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Compile instrumented tests
        run: ./gradlew compileDebugAndroidTestKotlin
      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openScale-debug-apk
          path: android_app/app/build/outputs/apk/debug/openScale-debug.apk
      - uses: "marvinpinto/action-automatic-releases@latest"
        if: github.event_name == 'push'
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "dev-build"
          prerelease: true
          title: "openScale development build"
          files: |
            android_app/app/build/outputs/apk/debug/openScale-debug.apk
